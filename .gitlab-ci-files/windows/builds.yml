##      ON SCHEDULE     ##
vs2017-uwp-scheduled-windows:
  extends: .windows-vs2017-scheduled
  rules:
    - if: $NIGHTLY_MASTER
    - if: $NIGHTLY_RELEASE
    - if: $WINDOWS_VS2017
    - if: $DEPLOY_RUN_WINDOWS
    - &nuget_deploy_rule
      if: $DEPLOY_RUN_NUGET
    - if: $ENABLE_WINDOWS_UWP_TESTS
    - if: $ENABLE_WINDOWS_TESTS
    - &nuget_dev_rule
      if:  $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci-files/job-windows.yml
        - .gitlab-ci-files/job-packages.yml
        - cmake/NuGet/Windows/**/*
  variables:
    LINPHONESDK_PLATFORM: UWP
    CMAKE_OPTIONS: -DENABLE_UNIT_TESTS=YES -DENABLE_OPENH264=YES -DENABLE_NON_FREE_CODECS=YES
    OUTPUT_ZIP_FOLDER: uwp
    MINGW_TYPE: mingw64
    CMAKE_GENERATOR: "Visual Studio 15 2017"

